<!DOCTYPE html>
<html>
<head>

  <title> wiki opener yeah</title>

</head> 
<body>

  <script>
    
    let URLstuff = new URLSearchParams(window.location.search);
    let pages = URLstuff.get("pages");

    if (pages) {
      let wikiURLs = pages.split("|");

      let opened = 0;
      let blocked = 0;
      
      for (let i = wikiURLs.length - 1; i >= 0; i--) {
        let newtab = window.open(wikiURLs[i], "_blank");

        if (newtab) {
          opened++;
        } else {
          blocked++;
        }
      }

      console.log("opened tabs:", opened);
      console.log("blocked tabs:", blocked);

      if (opened === wikiURLs.length) {
        window.close();
      }
    }
    
  </script>

</body>

</html>
