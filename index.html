<!DOCTYPE html>
<html>
<head>

  <title> wiki opener yeah</title>

  <style>
    body {
      background-color: black;
      color: white;
      text-align: center;
      padding-top: 100px;
    }

    h1 {
      font-size: 40px
    }

    
      
  </style>
</head> 
<body>

  <h1> opening the bit.,,,,</h1>

  <p>btw if the wikipedia pages dont open then its probably because it got blocked by your browser so just allow popups for this url and refresh the page or something</p>

  <script>
    
    let URLstuff = new URLSearchParams(window.location.search);
    let pages = URLstuff.get("pages");

    if (pages) {
      let wikiURLs = pages.split("|");

      let opened = 0;
      let blocked = 0;
      
      for (let i = wikiURLs.length - 1; i >= 1; i--) {
        let newtab = window.open(wikiURLs[i], "_blank");

        if (newtab) {
          opened++;
        } else {
          blocked++;
        }
      }

      console.log("opened tabs:", opened);
      console.log("blocked tabs:", blocked);

      if (opened === wikiURLs.length - 1) {
        window.location.href = wikiURLs[0];
      }
    }
    
  </script>

</body>

</html>
